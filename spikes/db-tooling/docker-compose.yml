# Disposable PostgreSQL for the ADR-0014 spike. Data lives on tmpfs and is
# destroyed with the container. Bound to localhost only. Passwords are
# local-only placeholders, not secrets.
name: schoolos-spike-db-tooling

services:
  postgres:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_PASSWORD: spike-local-only-superuser
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
